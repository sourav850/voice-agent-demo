<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Agent</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14171c;
    --panel-2: #1b1f26;
    --line: #262b33;
    --text: #e7ecf3;
    --muted: #7d8894;
    --accent: #4f8cff;
    --good: #2ecc71;
    --bad: #ff5c5c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--panel);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: 0.3px; }
  header .status {
    margin-left: auto;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok   { background: var(--good); }
  .dot.bad  { background: var(--bad); }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 780px;
    width: 100%;
    margin: 0 auto;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.you   { background: var(--panel-2); border-color: #2f3641; }
  .msg.meta  { background: transparent; border-style: dashed; color: var(--muted); font-size: 12px; }
  .msg.err   { border-color: var(--bad); }
  .msg .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 6px; }
  .msg pre { margin: 0; font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12.5px; }

  footer {
    padding: 14px 20px;
    border-top: 1px solid var(--line);
    background: var(--panel);
    display: flex;
    gap: 10px;
    align-items: center;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
  }
  #mic {
    width: 44px; height: 44px; border-radius: 50%;
    border: none; cursor: pointer;
    background: var(--panel-2); color: var(--text);
    font-size: 18px;
    transition: background 0.15s, transform 0.1s;
  }
  #mic:hover { background: #23283053; }
  #mic.recording { background: var(--bad); transform: scale(1.05); }
  #input {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 11px 14px;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    background: var(--accent);
    color: white;
    border: none;
    padding: 11px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  #send:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
    <div style="background:#ffb347;color:#000;padding:8px 16px;text-align:center;font-weight:600">
  🟡 DEMO MODE — Actions are simulated. The real agent runs locally.
</div>
<header>
  <h1>Voice Agent</h1>
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="statusText">connecting…</span>
  </div>
</header>

<main id="chat"></main>

<footer>
  <button id="mic" title="Hold to talk">🎤</button>
  <input id="input" autocomplete="off" placeholder="Type a command, or hold the mic…">
  <button id="send" disabled>Send</button>
</footer>

<script>
"use strict";

const chat       = document.getElementById("chat");
const input      = document.getElementById("input");
const sendBtn    = document.getElementById("send");
const micBtn     = document.getElementById("mic");
const dot        = document.getElementById("dot");
const statusText = document.getElementById("statusText");

let busy = false;               // prevent concurrent commands
let mediaRecorder = null;
let audioChunks = [];
let recordingStream = null;

// ---------- rendering --------------------------------------------------
function addMessage(label, text, cls = "") {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  const lbl = document.createElement("div");
  lbl.className = "label";
  lbl.textContent = label;
  const body = document.createElement("div");
  body.textContent = text;
  div.appendChild(lbl);
  div.appendChild(body);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addBlock(label, obj, cls = "") {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  const lbl = document.createElement("div");
  lbl.className = "label";
  lbl.textContent = label;
  const pre = document.createElement("pre");
  pre.textContent = JSON.stringify(obj, null, 2);
  div.appendChild(lbl);
  div.appendChild(pre);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function setBusy(v) {
  busy = v;
  sendBtn.disabled = v || input.value.trim().length === 0;
  input.disabled = v;
}

// ---------- health check ----------------------------------------------
async function checkHealth() {
  try {
    const r = await fetch("/api/health");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const h = await r.json();
    dot.classList.remove("bad");
    dot.classList.add("ok");
    statusText.textContent = h.cloud_model || "ready";
  } catch {
    dot.classList.remove("ok");
    dot.classList.add("bad");
    statusText.textContent = "backend offline";
  }
}

// ---------- text command ----------------------------------------------
async function sendCommand(text) {
  if (busy || !text.trim()) return;

  setBusy(true);
  addMessage("You", text, "you");

  // Demo mode: simulate processing delay.
  await new Promise(resolve => setTimeout(resolve, 800));

  const fakeIntent = mockIntentFor(text);
  addBlock("Intent (Demo)", fakeIntent, "meta");

  if (fakeIntent.action === "general_chat") {
    addMessage("Agent", fakeIntent.response, "you");
  } else if (fakeIntent.action === "unknown") {
    addMessage("Agent", fakeIntent.reason, "err");
  } else {
    addMessage(
      "Result (Demo)",
      `The local agent would execute: ${fakeIntent.action}`,
      ""
    );
  }

  setBusy(false);
  input.focus();
}
function mockIntentFor(text) {
  const t = text.toLowerCase();

  if (t.includes("call") && t.includes("whatsapp")) {
    return {
      action: "whatsapp_call",
      contact: "Demo Contact",
      call_type: t.includes("video") ? "video" : "audio"
    };
  }

  if (t.includes("whatsapp")) {
    return {
      action: "send_whatsapp",
      contact: "Demo Contact",
      message: "Hello from the demo!"
    };
  }

  if (t.includes("email") || t.includes("mail")) {
    return {
      action: "send_email",
      to: "someone@example.com",
      subject: "Demo Email",
      body: "This email would be sent by the local agent."
    };
  }

  if (t.includes("excel") || t.includes("spreadsheet")) {
    return {
      action: "create_excel",
      filename: "demo.xlsx",
      sheet_name: "Sheet1",
      headers: ["Name", "Price"],
      rows: [["Example", "100"]]
    };
  }

  if (t.includes("word") || t.includes("document")) {
    return {
      action: "create_word_doc",
      filename: "demo.docx",
      title: "Demo Document",
      paragraphs: ["This document would be generated locally."]
    };
  }

  if (t.includes("search") || t.includes("google")) {
    return {
      action: "web_search",
      query: text,
      browser: "default",
      engine: "google"
    };
  }

  if (t.includes("open")) {
    return {
      action: "open_app",
      app_name: text.replace(/open/gi, "").trim() || "Notepad"
    };
  }

  return {
    action: "general_chat",
    response:
      "This is demo mode. The real application runs locally and can control a Windows desktop."
  };
}

input.addEventListener("input", () => {
  sendBtn.disabled = busy || input.value.trim().length === 0;
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    const text = input.value.trim();
    if (text) {
      input.value = "";
      sendBtn.disabled = true;
      sendCommand(text);
    }
  }
});

sendBtn.addEventListener("click", () => {
  const text = input.value.trim();
  if (text) {
    input.value = "";
    sendBtn.disabled = true;
    sendCommand(text);
  }
});

// ---------- voice input (hold the mic button) --------------------------
async function startRecording() {
  if (busy || mediaRecorder) return;
  try {
    recordingStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    addMessage("Mic", "Microphone permission denied or unavailable: " + e.message, "err");
    return;
  }
  audioChunks = [];
  mediaRecorder = new MediaRecorder(recordingStream);

  mediaRecorder.ondataavailable = (e) => {
    if (e.data.size > 0) audioChunks.push(e.data);
  };

  mediaRecorder.onstop = async () => {
    const blob = new Blob(audioChunks, { type: "audio/webm" });
    audioChunks = [];
    micBtn.classList.remove("recording");

    // Release the microphone immediately.
    if (recordingStream) {
      recordingStream.getTracks().forEach((t) => t.stop());
      recordingStream = null;
    }
    mediaRecorder = null;

    if (blob.size < 1000) {
      addMessage("Mic", "Recording too short — ignored.", "meta");
      return;
    }

    setBusy(true);
    addMessage("Mic", "Transcribing locally…", "meta");
    try {
      const fd = new FormData();
      fd.append("file", blob, "recording.webm");
      const r = await fetch("/api/voice", { method: "POST", body: fd });
      const data = await r.json();

      if (!data.ok) {
        addMessage("Error", data.message || data.error || "transcription failed", "err");
        return;
      }

      // Drop the transcribed text into the input so the user can edit
      // before sending — same UX as the CLI's `prompt_toolkit` step.
      input.value = data.text;
      input.focus();
      input.setSelectionRange(data.text.length, data.text.length);
      sendBtn.disabled = false;
    } catch (e) {
      addMessage("Error", "Upload failed: " + e.message, "err");
    } finally {
      setBusy(false);
    }
  };

  mediaRecorder.start();
  micBtn.classList.add("recording");
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state === "recording") {
    mediaRecorder.stop();
  }
}

micBtn.addEventListener("mousedown", startRecording);
micBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startRecording(); });

micBtn.addEventListener("mouseup", stopRecording);
micBtn.addEventListener("mouseleave", stopRecording);
micBtn.addEventListener("touchend",  (e) => { e.preventDefault(); stopRecording(); });

// ---------- boot -------------------------------------------------------
addMessage(
  "Welcome",
  "Type a command or hold the mic button.\n\n" +
  "Examples:\n" +
  "  • search for channa mereya on firefox\n" +
  "  • open notepad\n" +
  "  • create an excel file with 3 columns: name, price, quantity\n" +
  "  • send an email to someone@example.com saying hello\n" +
  "  • open whatsapp and audio call to fiq bhai\n" +
  "  • hi how are you",
  "meta"
);

checkHealth();
setInterval(checkHealth, 15000);
input.focus();
</script>
</body>
</html>
